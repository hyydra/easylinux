# easyset package settings
# 1 = apply automatically, 0 = only when you run `easyset` yourself.

# Apply system settings when the package is installed/upgraded (root):
# GRUB never waits forever, rollback tool + boot guard, and the ThinkPad X280 fixes on an X280.
AUTO_SYSTEM=1

# Apply per-user settings once at the first login of each user:
# global keyboard layout, panel watchdog, Ctrl+C / Ctrl+V terminal.
AUTO_USER=1
