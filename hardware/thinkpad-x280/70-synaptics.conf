Section "InputClass"
    Identifier "Synaptics TM3381 Touchpad Full Height Split"
    Driver "synaptics"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Option "ClickPad" "true"

    # Full-height vertical split: everything right of X=3471 is the right button.
    # The synaptics driver uses the device's own coordinates. 3471 is the middle of the X280
    # PS/2 pad (X 1266..5676); setup-touchpad-split.sh recomputes it from the real device
    # (an SMBus/RMI4 pad would be 0..1936, i.e. 968). A value outside the pad's range makes
    # the WHOLE pad a right button.
    Option "SoftButtonAreas" "3471 0 0 0 0 0 0 0"
    Option "SecondarySoftButtonAreas" "0 0 0 0 0 0 0 0"

    # Two-finger natural scrolling
    Option "VertTwoFingerScroll" "1"
    Option "HorizTwoFingerScroll" "1"
    Option "VertScrollDelta" "-111"
    Option "HorizScrollDelta" "-111"

    # Tap-to-click (1 finger = left, 2 fingers = right, 3 fingers = middle)
    Option "TapButton1" "1"
    Option "TapButton2" "3"
    Option "TapButton3" "2"
EndSection
