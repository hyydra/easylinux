# easylinux: Windows-style clipboard, never Shift+Ctrl
#   Ctrl+C  copies the selection and clears it; with no selection it sends the
#           normal interrupt (SIGINT), so Ctrl+C still stops programs, also over ssh.
#   Ctrl+V  pastes.
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
copy_on_select no
