name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y grub-common
      - name: Run tests
        run: make test
      - name: Build packages
        run: |
          make deb
          make tarball
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
