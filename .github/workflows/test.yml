name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y grub-common shellcheck
      - name: Run tests
        run: make test
      - name: shellcheck (advisory)
        continue-on-error: true
        run: git ls-files '*.sh' | xargs shellcheck -S warning
